name: Deploy archive API to Cloud Run

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/dashboard/**"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: snuti-exp-cloud-run-production
  cancel-in-progress: false

jobs:
  deploy:
    # This explicit opt-in keeps production safe until Google Cloud Workload
    # Identity Federation and Cloud Run secrets are configured.
    if: github.ref == 'refs/heads/main' && vars.CLOUD_RUN_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
      CLOUD_RUN_REGION: asia-northeast3
      CLOUD_RUN_SERVICE: snuti-exp-archive-server-git
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Validate deployment settings
        run: |
          test -n "$GCP_PROJECT_ID"
          test -n "$GCP_WORKLOAD_IDENTITY_PROVIDER"
          test -n "$GCP_SERVICE_ACCOUNT"

      - id: auth
        name: Authenticate to Google Cloud with GitHub OIDC
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Build and deploy the API
        run: |
          gcloud builds submit \
            --project "$GCP_PROJECT_ID" \
            --config cloudbuild.yaml \
            --substitutions="COMMIT_SHA=$GITHUB_SHA" \
            .

      - name: Verify deployed health endpoint
        run: |
          service_url="$(gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$CLOUD_RUN_REGION" \
            --format='value(status.url)')"
          test -n "$service_url"
          curl --fail --show-error --silent "$service_url/actuator/health"
