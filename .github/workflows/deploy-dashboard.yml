name: Deploy archive dashboard to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/dashboard/**"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure public API URL
        env:
          API_BASE_URL: ${{ vars.EXP_ARCHIVE_API_BASE_URL }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const url = (process.env.API_BASE_URL || "").trim().replace(/\/+$/, "");
          if (url && !/^https?:\/\//.test(url)) {
            throw new Error("EXP_ARCHIVE_API_BASE_URL must be an http(s) URL.");
          }
          fs.writeFileSync(
            "docs/dashboard/api-config.js",
            `window.EXP_ARCHIVE_API_BASE_URL = ${JSON.stringify(url)};\n`
          );
          NODE

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dashboard

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
