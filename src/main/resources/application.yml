server:
  port: ${PORT:8080}

spring:
  datasource:
    # Set these through the IDE, Docker/Cloud Run, or a secret manager. Never commit values here.
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  mail:
    host: smtp.gmail.com
    port: 587
    # Email endpoints fail when these are blank; normal server startup does not require mail.
    username: ${GMAIL_USERNAME:}
    password: ${GMAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

cloud:
  aws:
    region: ap-northeast-2
    s3:
      bucket: snuti-exp-archive-images-2026

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: lecture-archive
    access-token-exp-minutes: 60
  cdn:
    base-url: https://snuti-exp-archive-images-2026.s3.ap-northeast-2.amazonaws.com
  cors:
    # Add other trusted origins through CORS_ALLOWED_ORIGINS as a comma-separated list.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://haru1dh.github.io,http://localhost:5173,http://localhost:63342}

management:
  health:
    mail:
      enabled: false
  endpoint:
    health:
      # The public dashboard receives only UP/DOWN, never dependency details.
      show-details: never
  endpoints:
    web:
      exposure:
        include: health
